; Swarm firmware for classic ESP32 DevKit boards.
;   pio run -e robot1 -t upload      one env per robot: the ID must match its ArUco marker
;   pio run -e gateway -t upload     the ESP32 plugged into the laptop
;   pio run -e motortest -t upload   10 s wiring check before the first real run
[platformio]
default_envs = robot1, robot2, robot3, gateway, motortest

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I${PROJECT_DIR}/../core -Wall

[robot]
build_src_filter = +<robot/>

[env:robot1]
extends = robot
build_flags = ${env.build_flags} -DROBOT_ID=1
[env:robot2]
extends = robot
build_flags = ${env.build_flags} -DROBOT_ID=2
[env:robot3]
extends = robot
build_flags = ${env.build_flags} -DROBOT_ID=3

[env:gateway]
build_src_filter = +<gateway/>

[env:motortest]
build_src_filter = +<motortest/>
